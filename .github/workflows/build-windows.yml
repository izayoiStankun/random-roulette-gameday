name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel for generated metadata
        required: true
        type: choice
        default: beta
        options:
          - beta
          - latest
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Choose update channel
        id: release
        shell: pwsh
        run: |
          $channel = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.channel }}" } elseif ("${{ github.ref_name }}" -match "-") { "beta" } else { "latest" }
          $prerelease = ($channel -eq "beta").ToString().ToLower()
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
      - name: Build Windows installers
        run: npm run dist -- --config.publish.channel=${{ steps.release.outputs.channel }}
      - uses: actions/upload-artifact@v4
        with:
          name: roulette-broadcast-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/${{ steps.release.outputs.channel }}.yml
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/${{ steps.release.outputs.channel }}.yml
